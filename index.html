<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E7 Fribbels & Smilegate Update Bot — Legal & Documentation</title>
  <style>
    :root {
      --bg: #161822;
      --panel: #202330;
      --border: #30354a;
      --accent: #5865f2;
      --gold: #f5c242;
      --text: #f0f2f8;
      --muted: #a0a8bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 820px;
      margin: 60px auto;
      padding: 0 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 1.9rem;
      color: var(--gold);
    }
    p {
      color: var(--muted);
    }
    .links {
      display: flex;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>E7 Fribbels &amp; Smilegate Update Discord Bot</h1>
      <p>
        Community utility bot for <strong>Epic Seven</strong> players providing live Fribbels Hero Library stat benchmarks,
        player character build sharing &amp; comparison cards, battle replay archives, and official Smilegate RSS update feeds.
      </p>
      <div class="links">
        <a class="btn" href="./terms.html">📜 Terms of Service</a>
        <a class="btn btn-secondary" href="./privacy.html">🔒 Privacy Policy</a>
      </div>
    </div>
  </div>
</body>
</html>
